[package]
name = "rusters-cli"
version = "0.1.4"
edition = "2021"
authors = ["Untrustnova Community"]
license = "Apache-2.0"
description = "Rusters CLI — cargo-ignite, cargo-boot, cargo-push, cargo-pull, cargo-seed, cargo-link, cargo-unlink"
repository = "https://github.com/untrustnova/rusters-cli"
homepage = "https://github.com/untrustnova/rusters-cli"
keywords = ["rusters", "cli", "web", "framework", "scaffold"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cargo-ignite"
path = "src/bin/cargo-ignite.rs"

[[bin]]
name = "cargo-boot"
path = "src/bin/cargo-boot.rs"

[[bin]]
name = "cargo-push"
path = "src/bin/cargo-push.rs"

[[bin]]
name = "cargo-pull"
path = "src/bin/cargo-pull.rs"

[[bin]]
name = "cargo-seed"
path = "src/bin/cargo-seed.rs"

[[bin]]
name = "cargo-link"
path = "src/bin/cargo-link.rs"

[[bin]]
name = "cargo-unlink"
path = "src/bin/cargo-unlink.rs"

[dependencies]
rusters-core = { git = "https://github.com/untrustnova/rusters-core" }

tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
async-trait = "0.1"
futures-util = "0.3"

clap = { version = "4", features = ["derive", "cargo", "env"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
colored = "2"
crossterm = "0.27"
include_dir = { version = "0.7", features = ["glob"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
